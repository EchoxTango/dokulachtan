plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.dokulachtan.signerpoc'
    compileSdk 35

    defaultConfig {
        applicationId 'cz.dokulachtan.signerpoc'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
