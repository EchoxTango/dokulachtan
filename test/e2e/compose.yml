# E2E stack: DocuSeal + Postgres na statických IP (CNI bez DNS pluginu).
# Použití: .venv/bin/podman-compose -f test/e2e/compose.yml -p e2e up -d
services:
  app:
    image: docker.io/docuseal/docuseal:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@10.89.99.2:5432/docuseal
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data/docuseal
    networks:
      e2e:
        ipv4_address: 10.89.99.3

  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./pg_data:/var/lib/postgresql/18/docker
    networks:
      e2e:
        ipv4_address: 10.89.99.2

networks:
  e2e:
    ipam:
      config:
        - subnet: 10.89.99.0/24
